ody> <div class="container"> <h1>rkivecity.com</h1> <div class="subtitle"> This domain is available. </div> <button class="offer-button" onclick="showForm()" type="button" > Make an offer </button> <div class="form-container" id="offerForm"> <form action="https://formspree.io/f/xbgjlkpd" method="POST" id="domainOfferForm" > <label for="name">Name</label> <input type="text" id="name" name="name" placeholder="Your name" required /> <label for="email">Email</label> <input type="email" id="email" name="email" placeholder="you@example.com" required /> <label for="offer">Offer</label> <input type="text" id="offer" name="offer" placeholder="Enter your offer" required /> <label for="message">Message</label> <textarea id="message" name="message" placeholder="Anything you'd like to add..." ></textarea> <input type="hidden" name="domain" value="rkivecity.com" /> <button class="submit-button" type="submit" > Submit offer </button> </form> <div class="success" id="successMessage"> Thanks. Your offer has been sent. </div> </div> <footer> Domain available for acquisition </footer> </div> <script> function showForm() { document .getElementById("offerForm") .classList.add("active"); document .querySelector(".offer-button") .style.display = "none"; } document .getElementById("domainOfferForm") .addEventListener("submit", async function (event) { event.preventDefault(); const form = event.target; const button = form.querySelector(".submit-button"); button.disabled = true; button.textContent = "Sending..."; try { const response = await fetch(form.action, { method: "POST", body: new FormData(form), headers: { Accept: "application/json" } }); if (response.ok) { form.style.display = "none"; document .getElementById("successMessage") .style.display = "block"; } else { throw new Error("Submission failed"); } } catch (error) { button.disabled = false; button.textContent = "Submit offer"; alert( "Something went wrong. Please try again." ); } }); </script> </body> </html>
